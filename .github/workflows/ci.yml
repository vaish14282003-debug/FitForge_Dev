name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # mongodb-memory-server downloads a MongoDB binary on first use; cache it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Website lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_URL: http://localhost:4000
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (production images)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      NET: fitforge-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t fitforge-api ./backend
          docker build -t fitforge-web --build-arg API_URL=http://api:4000 ./frontend
      - name: Start a throwaway stack with demo data
        run: |
          docker network create $NET
          docker run -d --name mongo --network $NET --network-alias mongo mongo:8
          sleep 5
          docker run --rm --network $NET -e NODE_ENV=development -e MONGO_URI=mongodb://mongo:27017/fitforge \
            -e JWT_ACCESS_SECRET=ci-only-secret-ci-only-secret-ci-only-secret fitforge-api node scripts/seed.js
          docker run -d --name api --network $NET --network-alias api -e MONGO_URI=mongodb://mongo:27017/fitforge \
            -e JWT_ACCESS_SECRET=ci-only-secret-ci-only-secret-ci-only-secret -e APP_URL=http://localhost:3000 \
            -e AUTH_RATE_LIMIT=1000 fitforge-api
          docker run -d --name web --network $NET -p 3000:3000 fitforge-web
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ALLOW_WRITES: "1"
        run: npx playwright test
      - if: failure()
        run: docker logs api; docker logs web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
