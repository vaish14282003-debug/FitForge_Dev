# Render Blueprint for the FitForge API. The website goes on Vercel (see DEPLOY.md).
services:
  - type: web
    name: fitforge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free # sleeps after 15 min idle; switch to starter for always-on
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 2 # Vercel's rewrite + Render's load balancer
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://fitforge.vercel.app
      - key: APP_URL
        sync: false # same as CLIENT_ORIGIN; used in emailed links
      - key: RESEND_API_KEY
        sync: false # resend.com API key (re_...). Or leave empty and set SMTP_URL instead.
      - key: SMTP_URL
        sync: false # optional alternative to Resend: smtps://user:pass@smtp.example.com:465
      - key: MAIL_FROM
        sync: false # e.g. FitForge <no-reply@yourdomain.com>, on a domain verified in Resend
      - key: SENTRY_DSN
        sync: false # optional: Sentry project DSN for error tracking
      - key: STORAGE_DRIVER
        sync: false # "local" to start (uploads reset on each deploy); "s3" once the AWS_* values are set
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
