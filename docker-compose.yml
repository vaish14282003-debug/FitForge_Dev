# Development: `docker compose up -d` starts MongoDB only; run the API and website with `npm run dev`.
# Whole stack in containers: `docker compose --profile full up --build` (website on http://localhost:3000;
# set WEB_PORT to use another port).
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    profiles: [full]
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/fitforge
      # Change this for anything beyond trying it locally (48+ random characters).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-secret-change-me-local-compose-secret}
      CLIENT_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STORAGE_DRIVER: local
    volumes:
      - uploads:/app/uploads

  web:
    profiles: [full]
    build:
      context: ./frontend
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  mongo-data:
  uploads:
